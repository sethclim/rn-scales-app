<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31CBD1"/>
      <stop offset="1" stop-color="#61E0A1"/>
    </linearGradient>
    <linearGradient id="whiteKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5E9F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- White keys: one octave, C to B -->
  <g fill="url(#whiteKey)">
    <rect x="180" y="272" width="88" height="504" rx="16"/>
    <rect x="276" y="272" width="88" height="504" rx="16"/>
    <rect x="372" y="272" width="88" height="504" rx="16"/>
    <rect x="468" y="272" width="88" height="504" rx="16"/>
    <rect x="564" y="272" width="88" height="504" rx="16"/>
    <rect x="660" y="272" width="88" height="504" rx="16"/>
    <rect x="756" y="272" width="88" height="504" rx="16"/>
  </g>

  <!-- Key rail -->
  <rect x="172" y="248" width="680" height="48" rx="16" fill="#2E3440"/>

  <!-- Black keys: C#, D#, F#, G#, A# -->
  <g fill="#2E3440">
    <rect x="244" y="280" width="56" height="292" rx="12"/>
    <rect x="340" y="280" width="56" height="292" rx="12"/>
    <rect x="532" y="280" width="56" height="292" rx="12"/>
    <rect x="628" y="280" width="56" height="292" rx="12"/>
    <rect x="724" y="280" width="56" height="292" rx="12"/>
  </g>
</svg>
